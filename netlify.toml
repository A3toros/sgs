[build]
  publish = ".next"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Keep chromium binaries on disk — bundling breaks @sparticuz/chromium path resolution
  external_node_modules = ["@sparticuz/chromium", "puppeteer-core"]

[functions."run-script"]
  timeout = 26

[functions."run-script-http"]
  timeout = 26

# Do not add redirects for /.netlify/* — Netlify serves functions automatically.
# Next.js handles its own routing under netlify dev / the Next plugin.